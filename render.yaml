databases:
  # Free-tier Postgres for persistence across deploys. seed.py now skips
  # seeding if the DB already has data (see seed.py docstring), so this
  # combination is what actually makes data survive a deploy — Postgres
  # alone isn't enough if seed.py still unconditionally wiped it.
  - name: lastmeter-ai-db
    plan: free

services:
  - type: web
    name: lastmeter-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # seed.py is safe to run on every deploy now — it only seeds an empty
    # database, never touches one that already has data (manual agents,
    # order status changes, etc. all persist across deploys).
    startCommand: python seed.py && gunicorn -k gthread -w 1 --threads 4 --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Auto-wired to the lastmeter-ai-db Postgres instance above (new
      # provisions only — the existing live service needs this set manually
      # in the Render dashboard: Environment → DATABASE_URL → paste the
      # Postgres instance's Internal Database URL, then redeploy).
      - key: DATABASE_URL
        fromDatabase:
          name: lastmeter-ai-db
          property: connectionString
      # Pinned to the live Vercel frontend. This only sets the value on first
      # provisioning — if the service already exists, update CORS_ORIGINS in
      # the Render dashboard directly (this file won't retroactively change it).
      - key: CORS_ORIGINS
        value: "https://lastmeterai-lq6p.vercel.app"
      # Set these manually in the Render dashboard if you have the keys.
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
