services:
  - type: web
    name: lastmeter-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Auto-seed on every deploy (Option A: ephemeral SQLite).
    # Database resets on each restart but always has demo data.
    startCommand: python seed.py && gunicorn -k gthread -w 1 --threads 4 --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # SQLite path — Flask places this under backend/instance/lastmeter.db
      - key: DATABASE_URL
        value: sqlite:///lastmeter.db
      # Pinned to the live Vercel frontend. This only sets the value on first
      # provisioning — if the service already exists, update CORS_ORIGINS in
      # the Render dashboard directly (this file won't retroactively change it).
      - key: CORS_ORIGINS
        value: "https://lastmeterai-lq6p.vercel.app"
      # Set these manually in the Render dashboard if you have the keys.
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
