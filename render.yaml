databases:
  # Free-tier Postgres for persistence across deploys. seed.py now skips
  # seeding if the DB already has data (see seed.py docstring), so this
  # combination is what actually makes data survive a deploy — Postgres
  # alone isn't enough if seed.py still unconditionally wiped it.
  - name: lastmeter-ai-db
    plan: free

services:
  - type: web
    name: lastmeter-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # seed.py is safe to run on every deploy now — it only seeds an empty
    # database, never touches one that already has data (manual agents,
    # order status changes, etc. all persist across deploys).
    startCommand: python seed.py && gunicorn -k gthread -w 1 --threads 4 --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Auto-wired to the lastmeter-ai-db Postgres instance above (new
      # provisions only — the existing live service needs this set manually
      # in the Render dashboard: Environment → DATABASE_URL → paste the
      # Postgres instance's Internal Database URL, then redeploy).
      - key: DATABASE_URL
        fromDatabase:
          name: lastmeter-ai-db
          property: connectionString
      # Pinned to the live Vercel frontend. This only sets the value on first
      # provisioning — if the service already exists, update CORS_ORIGINS in
      # the Render dashboard directly (this file won't retroactively change it).
      - key: CORS_ORIGINS
        value: "https://lastmeterai-lq6p.vercel.app"
      # Set these manually in the Render dashboard if you have the keys.
      # GEMINI_API_KEY is now required rather than optional: RAG embeddings
      # go through it, so without a key retrieval falls back to the local
      # model and the instance will exceed the free tier's 512MB.
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      # ── RAG ───────────────────────────────────────────────────────────────
      # Embeddings via the API, not a local model. The local backend loads
      # ~365MB of torch; measured peak RSS was 463MB against a 512MB cap,
      # i.e. an OOM kill. Via the API the same query peaks at 211MB, and the
      # 175MB model download on every cold start disappears with it.
      - key: RAG_EMBEDDING_PROVIDER
        value: gemini
      # The cross-encoder is the only thing left that would pull torch back
      # in, undoing the above. It also measured no better than splitting the
      # context budget between the two indexes.
      - key: RAG_RERANK_ENABLED
        value: "false"
      # Nothing local to warm once embeddings are remote.
      - key: RAG_WARM_ON_BOOT
        value: "false"
      # Free-tier generation is capped at 20 requests/day per model, shared
      # with the chat assistant. Past the cap answers stay grounded and cited
      # but are no longer synthesised into prose.
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
